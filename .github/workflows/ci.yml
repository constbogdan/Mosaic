name: CI
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} · {1}', github.event.pull_request.number, github.head_ref)
      || github.event_name == 'workflow_dispatch'
      && format('Validate · {0}', github.ref_name)
      || ' ' }}

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  full-validation:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Mosaic allocation requires the complete first-parent epoch history.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Choose PR validation path
        if: github.event_name == 'pull_request'
        id: pr-validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ startsWith(github.head_ref, 'chore/sync-upstream-') }}
        run: |
          policy_args=(
            --repo-root "$GITHUB_WORKSPACE"
            --base "$BASE_SHA"
            --head "$GITHUB_SHA"
            --github-output "$GITHUB_OUTPUT"
          )
          [[ "$FORCE_FULL" == 'true' ]] && policy_args+=(--force-full)

          trusted_policy="$RUNNER_TEMP/mosaic-validation-policy"
          mkdir -p "$trusted_policy"
          if git cat-file -e "$BASE_SHA:scripts/mosaic_validation_policy.py"; then
            git show "$BASE_SHA:scripts/mosaic_validation_policy.py" > "$trusted_policy/mosaic_validation_policy.py"
            git show "$BASE_SHA:scripts/mosaic_change_classification.py" > "$trusted_policy/mosaic_change_classification.py"
            PYTHONPATH="$trusted_policy" python -B "$trusted_policy/mosaic_validation_policy.py" "${policy_args[@]}"
          else
            # First rollout cannot trust a policy absent from base; require Full.
            python -B scripts/mosaic_validation_policy.py "${policy_args[@]}" --force-full
          fi
      - name: Explain PR validation plan
        if: github.event_name == 'pull_request' && steps.pr-validation.outcome == 'success'
        env:
          RELEASE_RELEVANCE: ${{ steps.pr-validation.outputs.release_relevance }}
          RELEASE_REQUIRED: ${{ steps.pr-validation.outputs.release_required }}
          VALIDATION_RISK: ${{ steps.pr-validation.outputs.validation_risk }}
          VALIDATION_MODE: ${{ steps.pr-validation.outputs.validation_mode }}
          CHANGED_PATH_COUNT: ${{ steps.pr-validation.outputs.changed_path_count }}
          REASON: ${{ steps.pr-validation.outputs.reason }}
        run: |
          python - <<'PY'
          import os

          e = os.environ
          mode = e['VALIDATION_MODE']
          relevance = e['RELEASE_RELEVANCE']
          if mode == 'full':
              headline = 'Full validation required — complete release validation is still needed.'
              next_step = 'Next: check changed files, run offline tooling tests, then run Full validation.'
          elif mode == 'targeted-android':
              headline = 'Focused Android validation selected — relevant Kotlin and JVM checks will run.'
              next_step = 'Next: check changed files, run mapped offline tests, then compile and test the affected Android behavior.'
          else:
              headline = 'Application validation not required — this change does not affect Android application code.'
              next_step = 'Next: check the changed files and run any mapped offline tooling tests.'
          if relevance == 'apk-relevant':
              change = 'This change can affect the installed application.'
          elif relevance == 'android-validation-only':
              change = 'This change needs Android checks but does not change the published APK.'
          elif relevance in {'docs-only', 'tooling-only'}:
              change = 'This change does not affect the published application.'
          else:
              change = 'The change type is uncertain, so validation remains conservative.'
          release = ('A Development release is expected after merge.' if e['RELEASE_REQUIRED'] == 'true'
                     else 'No Development release is expected from this PR alone.')
          lines = [
              '## Validation plan', '', headline, '', change, release, '', next_step, '',
              '<details>', '<summary>Technical details</summary>', '',
              f"Release relevance: `{relevance}`  ",
              f"Validation risk: `{e['VALIDATION_RISK']}`  ",
              f"Selected path: `{mode}`  ",
              f"Changed paths: `{e['CHANGED_PATH_COUNT']}`  ",
              f"Policy reason: {e['REASON']}", '', '</details>',
          ]
          with open(e['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Check changed files
        if: github.event_name == 'pull_request'
        id: pr-pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --from-ref ${{ github.event.pull_request.base.sha }} --to-ref ${{ github.sha }}
      - name: Check repository formatting
        if: github.event_name != 'pull_request'
        id: full-pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files
      - name: Run offline tooling checks
        if: github.event_name != 'pull_request' || steps.pr-validation.outputs.validation_mode == 'full' || steps.pr-validation.outputs.offline_test_pattern != ''
        id: offline-tests
        env:
          OFFLINE_TEST_PATTERN: ${{ steps.pr-validation.outputs.offline_test_pattern }}
        run: |
          pattern="${OFFLINE_TEST_PATTERN:-test_*.py}"
          python -B scripts/run_offline_tests.py --pattern "$pattern"
      - name: Check for reusable PR Full validation
        if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.ref_protected
        id: main-validation-reuse
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_validation_reuse.py reuse
      - name: Set up Android validation
        if: github.event_name != 'pull_request' || steps.pr-validation.outputs.validation_mode != 'non-android'
        uses: ./.github/actions/setup
      - name: Run Full validation
        if: >-
          (github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'full') ||
          (github.event_name != 'pull_request' && steps.main-validation-reuse.outputs.reuse_full != 'true')
        id: full-validation
        run: |
          ./gradlew \
            :app:compileDefaultDebugKotlin \
            :app:testDefaultDebugUnitTest \
            :app:assembleDefaultDebug \
            --no-daemon
      - name: Run targeted Android validation
        if: github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'targeted-android'
        id: targeted-validation
        env:
          FOCUSED_TESTS: ${{ steps.pr-validation.outputs.focused_tests }}
        run: |
          IFS=',' read -r -a tests <<< "$FOCUSED_TESTS"
          args=(:app:compileDefaultDebugKotlin :app:testDefaultDebugUnitTest)
          for test_filter in "${tests[@]}"; do
            [[ -n "$test_filter" ]] && args+=(--tests "$test_filter")
          done
          ./gradlew "${args[@]}" --no-daemon
      - name: Locate validated PR test APK
        if: success() && github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'full'
        id: pr-apk
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          directory = Path('app/build/outputs/apk/default/debug')
          metadata = json.loads((directory / 'output-metadata.json').read_text())
          assert metadata['variantName'] == 'defaultDebug'
          outputs = [item for item in metadata['elements']
                     if item['type'] == 'UNIVERSAL' and not item['filters']]
          assert len(outputs) == 1, 'Expected exactly one universal Debug APK'
          filename = outputs[0]['outputFile']
          assert re.fullmatch(r'Wholphin-default-debug-[A-Za-z0-9.-]+\.apk', filename)
          apk = directory / filename
          assert apk.is_file() and apk.stat().st_size > 0, 'Validated APK missing or empty'
          tested_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tested_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert tested_sha == os.environ['GITHUB_SHA'], 'Validated checkout differs from GITHUB_SHA'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'path={apk.as_posix()}\n')
              output.write(f'tested_sha={tested_sha}\n')
              output.write(f'tested_tree={tested_tree}\n')
          PY
      - name: Record reusable PR Full evidence
        if: success() && github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'full'
        id: pr-full-evidence
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python -B scripts/mosaic_validation_reuse.py record
      - name: Upload PR test APK
        if: success() && github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'full'
        id: upload-pr-apk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.pr-full-evidence.outputs.artifact_name }}
          path: ${{ steps.pr-apk.outputs.path }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Show PR test APK
        if: success() && github.event_name == 'pull_request' && steps.pr-validation.outputs.validation_mode == 'full'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APK_PATH: ${{ steps.pr-apk.outputs.path }}
          ARTIFACT_NAME: ${{ steps.pr-full-evidence.outputs.artifact_name }}
          TESTED_TREE: ${{ steps.pr-full-evidence.outputs.tested_tree }}
          ARTIFACT_URL: ${{ steps.upload-pr-apk.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os

          e = os.environ
          name = e['ARTIFACT_NAME']
          lines = [
              '## PR test APK ready', '',
              f'[Download the universal Debug APK]({e["ARTIFACT_URL"]})', '',
              'This is the APK produced by successful Full validation; it was not rebuilt.', '',
              ('Debug installs separately from Release Wholphin. Debug signing keys may differ '
               'between builds, so an in-place Debug update is not guaranteed.'), '',
              '<details>', '<summary>Install commands</summary>', '', '```text',
              f'gh run download {e["GITHUB_RUN_ID"]} --repo {e["GITHUB_REPOSITORY"]} --name {name}',
              f'adb install -r "{e["APK_PATH"].rsplit("/", 1)[-1]}"',
              '```', '', '</details>', '',
              '<details>', '<summary>Technical details</summary>', '',
              f'Artifact: `{name}`  ',
              f'PR: `{e["PR_NUMBER"]}`  ',
              f'Source/head SHA: `{e["PR_HEAD_SHA"]}`  ',
              f'Tested SHA: `{e["GITHUB_SHA"]}` (PR merge checkout)  ',
              f'Tested tree: `{e["TESTED_TREE"]}`  ',
              f'Base SHA: `{e["PR_BASE_SHA"]}`  ',
              f'Workflow run: `{e["GITHUB_RUN_ID"]}`, attempt `{e["GITHUB_RUN_ATTEMPT"]}`  ',
              f'APK: `{e["APK_PATH"]}`  ',
              'Retention: 7 days', '', '</details>',
          ]
          with open(e['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Explain protected-main validation result
        if: always() && github.event_name != 'pull_request'
        env:
          REUSE: ${{ steps.main-validation-reuse.outputs.reuse_full }}
          REUSE_STEP: ${{ steps.main-validation-reuse.outcome }}
          REASON: ${{ steps.main-validation-reuse.outputs.reason }}
          TESTED_TREE: ${{ steps.main-validation-reuse.outputs.tested_tree }}
          MAIN_TREE: ${{ steps.main-validation-reuse.outputs.main_tree }}
          PR_NUMBER: ${{ steps.main-validation-reuse.outputs.pr_number }}
          RUN_ID: ${{ steps.main-validation-reuse.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.main-validation-reuse.outputs.run_attempt }}
          FULL_RESULT: ${{ steps.full-validation.outcome }}
        run: |
          python - <<'PY'
          import os

          e = os.environ
          if e['REUSE'] == 'true':
              lines = [
                  '## Protected-main validation',
                  '',
                  f"Full validation reused — this exact tree already passed on PR #{e['PR_NUMBER']}.",
                  '',
                  'No action is required. Development release eligibility will be checked next.',
                  '',
                  '<details>', '<summary>Technical details</summary>', '',
                  f"Tested tree: `{e['TESTED_TREE']}`  ",
                  f"Main tree: `{e['MAIN_TREE']}`  ",
                  f"Required PR Full: run `{e['RUN_ID']}`, attempt `{e['RUN_ATTEMPT']}`",
                  '', '</details>',
              ]
          else:
              reason = e['REASON'] or ('reuse inspection failed; conservative fallback' if e['REUSE_STEP'] == 'failure' else 'event is not an eligible PR merge')
              result = e['FULL_RESULT'] or 'not completed'
              lines = [
                  '## Protected-main validation',
                  '',
                  ('Full validation passed on protected main.' if result == 'success'
                   else 'Full validation was required on protected main and did not pass.'),
                  '',
                  f'Reason: {reason}',
                  '',
                  ('No action is required. Development release eligibility will be checked next.'
                   if result == 'success' else 'Fix the failed validation step before publication can continue.'),
                  '',
                  '<details>', '<summary>Technical details</summary>', '',
                  f"Full result: `{result}`", '', '</details>',
              ]
          with open(e['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Show PR validation result
        if: always() && github.event_name == 'pull_request'
        env:
          RELEASE_RELEVANCE: ${{ steps.pr-validation.outputs.release_relevance }}
          VALIDATION_RISK: ${{ steps.pr-validation.outputs.validation_risk }}
          VALIDATION_MODE: ${{ steps.pr-validation.outputs.validation_mode }}
          CHANGED_PATH_COUNT: ${{ steps.pr-validation.outputs.changed_path_count }}
          PRE_COMMIT_RESULT: ${{ steps.pr-pre-commit.outcome }}
          OFFLINE_RESULT: ${{ steps.offline-tests.outcome }}
          TARGETED_RESULT: ${{ steps.targeted-validation.outcome }}
          FULL_RESULT: ${{ steps.full-validation.outcome }}
        run: |
          python - <<'PY'
          import os

          e = os.environ
          mode = e['VALIDATION_MODE'] or 'classification-failed'
          def mark(value):
              return 'PASS' if value == 'success' else ('SKIP' if value in {'', 'skipped'} else value.upper())
          results = [e['PRE_COMMIT_RESULT']]
          if e['OFFLINE_RESULT'] not in {'', 'skipped'}:
              results.append(e['OFFLINE_RESULT'])
          if mode == 'targeted-android':
              results.append(e['TARGETED_RESULT'])
          elif mode == 'full':
              results.append(e['FULL_RESULT'])
          passed = mode != 'classification-failed' and all(value == 'success' for value in results)
          lines = [
              '## Selected PR checks passed' if passed else '## PR validation needs attention',
              '',
              ('The selected checks completed successfully.' if passed
               else 'One or more required checks did not complete successfully.'),
              '',
              ('Confirm this required job is green, then review the PR and merge only when satisfied.' if passed
               else 'Inspect the failed check, correct the problem, and rerun validation.'),
              '',
              '### Results',
              f"- {mark(e['PRE_COMMIT_RESULT'])}: changed-range pre-commit",
          ]
          if e['OFFLINE_RESULT'] not in {'', 'skipped'}:
              lines.append(f"- {mark(e['OFFLINE_RESULT'])}: offline workflow/Python tests")
          if mode == 'targeted-android':
              lines.append(f"- {mark(e['TARGETED_RESULT'])}: Kotlin compile + focused JVM tests")
              lines.append('- Protected main will run or authenticate the authoritative Full validation gate')
          elif mode == 'full':
              lines.append(f"- {mark(e['FULL_RESULT'])}: Full defaultDebug validation")
          elif mode == 'non-android':
              lines.append('- NOT REQUIRED: Android application validation')
              lines.append('- Protected main remains the authoritative Full validation gate')
          else:
              lines.append('- FAIL: conservative validation selection was unavailable')
          lines += [
              '', '<details>', '<summary>Technical details</summary>', '',
              f"Release relevance: `{e['RELEASE_RELEVANCE'] or 'unknown'}`  ",
              f"Validation risk: `{e['VALIDATION_RISK'] or 'high'}`  ",
              f"Selected path: `{mode}`  ",
              f"Changed paths: `{e['CHANGED_PATH_COUNT'] or 'unknown'}`",
              '', '</details>',
          ]
          with open(e['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          PY
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: default-debug-test-results
          path: |
            app/build/test-results/testDefaultDebugUnitTest/**
            app/build/reports/tests/testDefaultDebugUnitTest/**
          retention-days: 7
          if-no-files-found: ignore

  release-build:
    name: Build Development Release
    needs: full-validation
    if: >-
      github.repository == 'constbogdan/Wholphin' && github.event_name == 'push' &&
      github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_required: ${{ steps.eligibility.outputs.release_required }}
      artifact_id: ${{ steps.unsigned.outputs.artifact-id }}
      artifact_name: unsigned-${{ steps.prepared.outputs.name }}
      build_run_id: ${{ github.run_id }}
      build_run_attempt: ${{ github.run_attempt }}
      version_name: ${{ steps.prepared.outputs.version_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
      - name: Decide whether a Development build is required
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/mosaic_development_release.py ci-eligibility
      - name: Set up Release build
        if: steps.eligibility.outputs.release_required == 'true'
        uses: ./.github/actions/setup
      - name: Build unsigned Development Release APK
        if: steps.eligibility.outputs.release_required == 'true'
        run: ./gradlew :app:assembleDefaultRelease -PmosaicPublication=true --no-daemon --no-parallel --max-workers=1
      - name: Prepare authenticated unsigned APK
        if: steps.eligibility.outputs.release_required == 'true'
        id: prepared
        env:
          MOSAIC_ARTIFACT_PREFIX: mosaic-main-ci
        run: python -B scripts/mosaic_signing_exercise.py prepare --directory "$RUNNER_TEMP/mosaic-main-release"
      - name: Upload authenticated unsigned APK
        if: steps.eligibility.outputs.release_required == 'true'
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-${{ steps.prepared.outputs.name }}
          path: ${{ runner.temp }}/mosaic-main-release/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Prepare Release mapping diagnostic
        if: steps.eligibility.outputs.release_required == 'true'
        run: |
          python -B - <<'PY'
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from mosaic_signing_exercise import prepare_mapping
          temporary = Path(os.environ['RUNNER_TEMP'])
          prepare_mapping(Path.cwd(), temporary / 'mosaic-main-release', temporary / 'mosaic-main-mapping')
          PY
      - name: Upload Release mapping diagnostic
        if: steps.eligibility.outputs.release_required == 'true'
        id: upload-main-mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mapping-${{ steps.prepared.outputs.name }}
          path: ${{ runner.temp }}/mosaic-main-mapping/
          retention-days: 7
          compression-level: 6
          if-no-files-found: error
      - name: Show Release mapping diagnostic
        if: steps.eligibility.outputs.release_required == 'true'
        env:
          MAPPING_URL: ${{ steps.upload-main-mapping.outputs.artifact-url }}
        run: |
          printf '## Release mapping retained\n\nDiagnostic mapping and source/build/run identity: %s\n\nRetention: 7 days. Existing authoritative Release output; no rebuild. Not an updater or GitHub Release asset.\n' "$MAPPING_URL" >> "$GITHUB_STEP_SUMMARY"

  sign-development:
    name: Sign Development
    needs: release-build
    if: needs.release-build.outputs.release_required == 'true'
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.signed.outputs.artifact-id }}
    environment: release-sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Require exact unsigned artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.release-build.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.release-build.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-input
      - name: Verify trusted unsigned APK
        env:
          MOSAIC_ARTIFACT_ID: ${{ needs.release-build.outputs.artifact_id }}
          MOSAIC_ARTIFACT_NAME: ${{ needs.release-build.outputs.artifact_name }}
          MOSAIC_BUILD_RUN_ID: ${{ needs.release-build.outputs.build_run_id }}
          MOSAIC_BUILD_RUN_ATTEMPT: ${{ needs.release-build.outputs.build_run_attempt }}
        run: |
          python3 -B scripts/mosaic_development_release.py ci-artifact --directory "$RUNNER_TEMP/mosaic-input"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$RUNNER_TEMP/mosaic-input/unsigned.apk"
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RUNNER_TEMP/mosaic-input/unsigned.apk" >/dev/null 2>&1; then
            echo 'Refusing already signed input' >&2
            exit 1
          fi
      - name: Sign exact APK without rebuilding
        env:
          MOSAIC_SIGNING_KEY: ${{ secrets.MOSAIC_SIGNING_KEY }}
          MOSAIC_KEY_ALIAS: ${{ secrets.MOSAIC_KEY_ALIAS }}
          MOSAIC_KEYSTORE_PASSWORD: ${{ secrets.MOSAIC_KEYSTORE_PASSWORD }}
          MOSAIC_KEY_PASSWORD: ${{ secrets.MOSAIC_KEY_PASSWORD }}
        uses: ./.github/actions/mosaic-sign-apk
      - name: Verify signed APK identity and unchanged payload
        run: |
          python3 -B scripts/mosaic_signing_exercise.py compare --directory "$RUNNER_TEMP/mosaic-input"
          mkdir "$RUNNER_TEMP/mosaic-result"
          python3 -B scripts/verify_mosaic_apk.py --apk "$RUNNER_TEMP/mosaic-input/signed.apk" --provenance "$RUNNER_TEMP/mosaic-input/provenance.json" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$RUNNER_TEMP/mosaic-result/verification.json"
          cp "$RUNNER_TEMP/mosaic-input/signed.apk" "$RUNNER_TEMP/mosaic-result/Mosaic-release.apk"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: signed
        with:
          name: signed-mosaic-development-${{ needs.release-build.outputs.version_name }}-${{ github.sha }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mosaic-result/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish-development:
    name: Publish Development
    needs: [release-build, sign-development]
    if: needs.release-build.outputs.release_required == 'true'
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact signed artifact ID
        env:
          INPUT_ARTIFACT_ID: ${{ needs.sign-development.outputs.artifact_id }}
        run: '[[ "$INPUT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.sign-development.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-result
      - name: Validate publication manifest before using write authority
        env:
          MOSAIC_BUILD_RUN_ID: ${{ needs.release-build.outputs.build_run_id }}
          MOSAIC_BUILD_RUN_ATTEMPT: ${{ needs.release-build.outputs.build_run_attempt }}
        run: python -B scripts/mosaic_development_release.py ci-manifest --directory "$RUNNER_TEMP/mosaic-result"
      - name: Publish verified Development APK
        env:
          GH_TOKEN: ${{ github.token }}
          MOSAIC_BUILD_RUN_ID: ${{ needs.release-build.outputs.build_run_id }}
          MOSAIC_BUILD_RUN_ATTEMPT: ${{ needs.release-build.outputs.build_run_attempt }}
        run: python -B scripts/mosaic_development_release.py ci-publish --directory "$RUNNER_TEMP/mosaic-result"
