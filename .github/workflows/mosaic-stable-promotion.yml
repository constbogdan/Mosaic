name: Stable Promotion
run-name: Stable Promotion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mosaic-development-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Prepare
    if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.verified.outputs.artifact-id }}
      version: ${{ steps.prepare.outputs.version }}
      build: ${{ steps.prepare.outputs.build }}
      apk_url: ${{ steps.prepare.outputs.apk_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: 'platform-tools build-tools;36.0.0'
      - name: Resolve and authenticate current Development release
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/mosaic_stable.py prepare --directory "$RUNNER_TEMP/mosaic-stable"
      - name: Verify APK package, version, signer, and provenance
        run: python3 -B scripts/verify_mosaic_apk.py --apk "$RUNNER_TEMP/mosaic-stable/Wholphin-release.apk" --provenance "$RUNNER_TEMP/mosaic-stable/provenance.json" --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" --aapt "$ANDROID_HOME/build-tools/36.0.0/aapt" --output "$RUNNER_TEMP/mosaic-stable/verification.json"
      - name: Confirm exact Development manifest and APK digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/mosaic_stable.py verify --directory "$RUNNER_TEMP/mosaic-stable"
      - name: Show release approval request
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          BUILD: ${{ steps.prepare.outputs.build }}
          APK_URL: ${{ steps.prepare.outputs.apk_url }}
        run: |
          printf '## Stable %s ready for approval\n\nExplicitly promote the authenticated Development build for normal consumption.\n\n[Download the exact candidate APK](%s)\n\nWaiting for <code>release-promote</code> approval. Nothing has been published by this run.\n\n<details>\n<summary>Technical details</summary>\n\nAuthenticated immutable build: <code>%s</code>\n\n</details>\n' "$VERSION" "$APK_URL" "$BUILD" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        id: verified
        with:
          name: stable-${{ steps.prepare.outputs.build }}-run-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mosaic-stable/
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Summarize failed stage
        if: failure()
        run: |
          printf "## Stable release preparation failed\n\nNothing was published. Inspect the failed step, correct the problem, and retry.\n\n<details>\n<summary>Technical details</summary>\n\nJob: <code>%s</code>\n\n</details>\n" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Release
    needs: verify
    if: github.repository == 'constbogdan/Wholphin' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected
    permissions:
      contents: write
      actions: read
    environment: release-promote
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact successful verification artifact ID
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.artifact_id }}
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          digest-mismatch: error
          merge-multiple: true
          path: ${{ runner.temp }}/mosaic-stable
      - name: Reauthenticate Development and publish exact verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/mosaic_stable.py publish --directory "$RUNNER_TEMP/mosaic-stable"
      - name: Summarize failed stage
        if: failure()
        run: |
          printf "## Stable release refused or failed\n\nPublication completion is not confirmed. Inspect the failed step and current Stable state before retrying.\n\n<details>\n<summary>Technical details</summary>\n\nJob: <code>%s</code>\n\n</details>\n" "$GITHUB_JOB" >> "$GITHUB_STEP_SUMMARY"
